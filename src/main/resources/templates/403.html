<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado · KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar-nature">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="fas fa-leaf"></i> KinalApp
        </a>
        <div class="d-flex gap-3 align-items-center">
            <span th:text="${#authentication.name}"></span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn-nature-outline">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="welcome-card">
                <i class="fas fa-ban fa-4x mb-4" style="color: #e74c3c;"></i>
                <h1 class="mb-3">Acceso Denegado</h1>
                <p class="text-muted mb-4">
                    No tienes permisos para acceder a esta sección.<br>
                    Contacta al administrador si crees que esto es un error.
                </p>
                <a href="/dashboard" class="btn-verde">
                    <i class="fas fa-home me-2"></i> Volver al Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
